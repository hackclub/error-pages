server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;

    server_tokens off;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /font/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
