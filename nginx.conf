server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;

    server_tokens off;

    location = / {
        return 503;
    }
    error_page 503 /index.html;


    location / {
        try_files $uri $uri/ =404;
    }

    location /font/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
